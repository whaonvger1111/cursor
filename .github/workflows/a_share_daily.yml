# 自动运行 A 股筛选脚本（北京时间周一至周五约 09:35）。
# GitHub Actions 的 cron 使用 UTC：北京时间 09:35 = UTC 01:35。
# 注意：cron 不会在法定节假日自动跳过；如需仅交易日可后续接入交易日历判断。

name: A-share daily analysis

on:
  schedule:
    # 周一至周五 UTC 01:35 → 北京时间 09:35（全年 UTC+8，无夏令时）
    - cron: "35 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install "akshare>=1.14.0" "pandas>=1.3.0"

      - name: Run analysis
        run: |
          set -euo pipefail
          python3 trading_agent/a_share_analysis.py --top 12 --json | tee report.json
          echo "---- UTF-8 preview (first 80 lines) ----"
          head -n 80 report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-share-report-${{ github.run_id }}
          path: report.json
          if-no-files-found: error
