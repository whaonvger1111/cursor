# 工作日北京时间 09:30（01:30 UTC，无夏令时）：拉取行情并输出 A 股规则化中文摘要。
name: Daily stock analysis

on:
  schedule:
    - cron: "30 1 * * 1-5"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily analysis
        env:
          # 可在仓库 Variables 中设置 STOCK_* 覆盖默认（A 股代码示例：600519.SS）
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS }}
          STOCK_LOOKBACK_DAYS: ${{ vars.STOCK_LOOKBACK_DAYS }}
          STOCK_BIG_MOVE_PCT: ${{ vars.STOCK_BIG_MOVE_PCT }}
        run: python3 -m trading_agent.run_daily_analysis
